<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Выгодные продукты</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      color: #111;
    }

    h1 {
      text-align: center;
      font-size: 26px;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 25px;
    }

    .card {
      max-width: 400px;
      margin: 0 auto;
      padding: 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
    }

    .card h2 {
      margin-top: 0;
    }

    .benefit {
      font-size: 24px;
      font-weight: bold;
      color: #e21b2d;
    }

    .button {
      display: block;
      margin-top: 20px;
      padding: 15px;
      text-align: center;
      text-decoration: none;
      color: white;
      background: #e21b2d;
      border-radius: 12px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Выгодные продукты 🔥</h1>

  <p class="subtitle">
    Выбирайте продукт и забирайте свою выгоду
  </p>

  <div class="card">
    <h2>Бизнес-карта Альфа-Банка</h2>

    <p class="benefit">До 7 000 ₽ выгоды</p>

    <p>
      Бесплатное оформление карты и доступ к акциям банка.
    </p>

    <a class="button" href="https://example.com">
      Оформить
    </a>
  </div>

</body>
</html>
